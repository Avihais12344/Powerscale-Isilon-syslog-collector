receivers:
  # syslog:
  #   tcp:
  #     listen_address: "0.0.0.0:54526"
  #   protocol: rfc5424
  #   preserve_raw_logs: true
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  file:
    path: /mnt/logs/logs.jsonl

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [file]
